name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          # One universal binary rather than two downloads.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --bin lolt --target "$target"
          done

      - name: Package
        id: package
        run: |
          staging="lolt-${{ matrix.name }}"
          mkdir -p "$staging"

          targets=(${{ matrix.targets }})
          if [ ${#targets[@]} -gt 1 ]; then
            slices=()
            for target in "${targets[@]}"; do
              slices+=("target/$target/release/lolt")
            done
            lipo -create "${slices[@]}" -output "$staging/lolt"
            lipo -archs "$staging/lolt"
          else
            cp "target/${targets[0]}/release/lolt" "$staging/lolt"
          fi

          cp README.md "$staging/"
          chmod +x "$staging/lolt"
          tar czf "$staging.tar.gz" "$staging"

          # sha256sum on Linux, shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          else
            shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          fi
          echo "archive=$staging.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged binary runs
        run: |
          tar xzf "${{ steps.package.outputs.archive }}" -C /tmp
          "/tmp/lolt-${{ matrix.name }}/lolt" --version

      - uses: actions/upload-artifact@v4
        with:
          name: lolt-${{ matrix.name }}
          path: |
            lolt-${{ matrix.name }}.tar.gz
            lolt-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
