[package]
name = "lolt"
version = "0.1.0"
edition = "2021"
description = "League of Legends esports tracker for the terminal"
license = "MIT"

[lib]
name = "lolt_core"
path = "src/lib.rs"
# rlib for the CLI, staticlib for the macOS widget to link against.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "lolt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
